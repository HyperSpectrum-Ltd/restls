name: Docker Build and Publish

on:
  push:
    branches: [ "main" ]    # 推送到 main 分支时触发
    tags: [ 'v*' ]          # 推送 v1.0.0 这种 tag 时触发
  workflow_dispatch:        # 允许手动触发

env:
  REGISTRY: ghcr.io
  # 镜像名称默认为：ghcr.io/用户名/项目名
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # 需要写入包的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU (可选，用于多架构构建，如 ARM64)
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的 Token

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 如果你想支持 ARM64 (比如跑在树莓派或甲骨文 ARM 上)，取消下面这行的注释
          # platforms: linux/amd64,linux/arm64
